# Cleaning configuration for Mapudungun (arn-CL)
# Used with the BYU Matrix Lab data-cleaning-pipeline.
# Deploy to: /home/it238/groups/grp_mtlab/projects/data-cleaning/data-cleaning-pipeline/config/arn-CL.yaml
#
# Design rationale:
#   - normalize_regex_patterns runs before character filtering, so tags and
#     annotation markers are removed first, then the character set is enforced.
#   - allowed_characters is intentionally permissive over ASCII (32-126) to
#     avoid filtering valid loanword punctuation. Only anomalous non-ASCII
#     characters (ç, ö, ¥, º, grave-accented vowels, etc.) are excluded.
#   - remove_duplicates and remove_source_equals_target are always-on in the
#     pipeline and need no config key.
#   - min_num_words is intentionally omitted: Mapudungun is polysynthetic and
#     a single word can express a complete clause.


# ---------------------------------------------------------------------------
# Step 1 — Normalize: strip annotation markers and noise before filtering
# ---------------------------------------------------------------------------
normalize_regex_patterns:

  # Full ELAN/CHAT inline tags: <*SPA>, <Noise>, <overlap>, <!2>word, etc.
  '<[^>]+>': ''

  # Incomplete tags missing their opening '<': SPA>, *SPA>, Noise>, Cough>, uh>
  # Anchored so we don't accidentally strip legitimate word-final '>' in Spanish.
  '(?:^| )\*?\w{1,10}>': ' '

  # Overlap markers +/.../+ and uncertainty markers -/.../ -
  # Strip the marker characters, keep the enclosed text.
  '\+/': ''
  '/\+': ''
  '-/': ''
  '/-': ''

  # CHAT transcription tier codes starting with %
  '%\S*': ''

  # Backslash (appears 7 times, always noise)
  '\\\\': ''

  # Null bytes
  '\x00': ''

  # Normalize tabs to space
  '\t': ' '

  # Collapse multiple spaces to one
  ' {2,}': ' '


# ---------------------------------------------------------------------------
# Step 2 — Enforce character set: drop pairs containing disallowed characters
# ---------------------------------------------------------------------------
# Values are Unicode decimal code points; ranges use 'start-end' notation.
# ASCII printable (32-126) is included in full — noise in that range is
# handled by normalize_regex_patterns above.
# Non-ASCII: include only characters with confirmed presence and validity
# in Mapudungun or Spanish loanword orthography.
allowed_characters:
  - '32-126'    # Full printable ASCII (space through ~)
  - '161'       # ¡  inverted exclamation
  - '191'       # ¿  inverted question mark
  - '193'       # Á
  - '201'       # É
  - '205'       # Í
  - '209'       # Ñ
  - '211'       # Ó
  - '218'       # Ú
  - '220'       # Ü  (common in Mapudungun)
  - '225'       # á
  - '233'       # é
  - '237'       # í
  - '241'       # ñ  (common in Mapudungun)
  - '243'       # ó
  - '250'       # ú
  - '252'       # ü  (very common in Mapudungun)


# ---------------------------------------------------------------------------
# Step 3 — Override aggressive default filters
# ---------------------------------------------------------------------------
# The default config sets min_num_words: 3 and remove_long_words: True with
# longest_word_length: 30. Both are inappropriate for Mapudungun:
#   - A single agglutinative word can be a grammatically complete clause.
#   - Mapudungun compounds regularly exceed 30 characters.

min_num_words: 1

remove_long_words: False
